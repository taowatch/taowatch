name: taowatch

# Images are published to GHCR by .github/workflows/images.yml.
# TAOWATCH_TAG: latest (main) · sha-<short> (one commit) · 0.1.0 (release tag v0.1.0)

x-backend: &backend
  image: ghcr.io/taowatch/taowatch-backend:${TAOWATCH_TAG:-latest}
  env_file: .env
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.31.2-pg18
    environment:
      POSTGRES_USER: taowatch
      POSTGRES_DB: taowatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taowatch -d taowatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["api"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  indexer:
    <<: *backend
    command: ["indexer", "run"]
    depends_on:
      api: { condition: service_healthy }   # api applies the migrations first

  web:
    image: ghcr.io/taowatch/taowatch-web:${TAOWATCH_TAG:-latest}
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
