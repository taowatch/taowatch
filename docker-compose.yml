name: taowatch

# Images are published to GHCR by .github/workflows/images.yml.
# TAOWATCH_TAG: latest (main) · sha-<short> (one commit) · 0.1.0 (release tag v0.1.0)
#
# Data lives in host folders under ${TAOWATCH_DATA_DIR} (default ./data).
# No public ports: the web container listens on ${WEB_BIND}:${WEB_PORT} (default 127.0.0.1:8088)
# for a reverse proxy such as nginx, which terminates TLS. See README → Deploy.

x-backend: &backend
  image: ghcr.io/taowatch/taowatch-backend:${TAOWATCH_TAG:-latest}
  env_file: .env
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.31.2-pg18
    environment:
      POSTGRES_USER: taowatch
      POSTGRES_DB: taowatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ${TAOWATCH_DATA_DIR:-./data}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taowatch -d taowatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["api"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  indexer:
    <<: *backend
    command: ["indexer", "run"]
    depends_on:
      api: { condition: service_healthy }   # api applies the migrations first

  web:
    image: ghcr.io/taowatch/taowatch-web:${TAOWATCH_TAG:-latest}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
